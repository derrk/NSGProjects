<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>OG source</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:800px;height:420px;overflow:hidden;background:#0B0B0B}
  .og-stage{width:1200px;height:630px;transform:scale(.6666667);transform-origin:top left}
  body{background:#0B0B0B;font-family:Inter,system-ui,sans-serif;color:#fff;position:relative}
  .glow1{position:absolute;top:-240px;left:-180px;width:900px;height:900px;
    background:radial-gradient(circle,rgba(124,58,237,.30) 0%,rgba(0,0,0,0) 70%)}
  .glow2{position:absolute;bottom:-300px;right:-200px;width:800px;height:800px;
    background:radial-gradient(circle,rgba(124,58,237,.18) 0%,rgba(0,0,0,0) 70%)}
  .wrap{position:relative;height:100%;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
  .brand{font-size:34px;font-weight:800;letter-spacing:-.8px}
  .brand i{color:#7C3AED;font-style:normal}
  .pill{display:inline-flex;align-items:center;gap:12px;padding:11px 24px;
    background:rgba(124,58,237,.12);border:1px solid rgba(124,58,237,.35);
    border-radius:100px;font-size:21px;color:#E5E7EB;margin-bottom:30px}
  .dot{width:9px;height:9px;border-radius:50%;background:#7C3AED}
  h1{font-size:76px;line-height:1.06;font-weight:800;letter-spacing:-3px;max-width:19ch}
  h1 em{color:#9D6EF8;font-style:normal}
  .foot{display:flex;align-items:center;justify-content:space-between;
    border-top:1px solid rgba(255,255,255,.12);padding-top:26px}
  .foot span{font-size:25px;color:#9CA3AF}
  .foot b{font-size:25px;font-weight:700;color:#fff}
</style></head>
<body>
<div class="og-stage">
  <div class="glow1"></div><div class="glow2"></div>
  <div class="wrap">
    <div class="brand">NSG<i>.</i>Studios</div>
    <div>
      <div class="pill"><span class="dot"></span>Wichita Falls &amp; North Texas</div>
      <h1>Web Design &amp; <em>AI Automation</em> for local business</h1>
    </div>
    <div class="foot">
      <span>wichitafallswebdesign.net</span>
      <b>(940) 276-2007</b>
    </div>
  </div>
</div>
</body></html>
