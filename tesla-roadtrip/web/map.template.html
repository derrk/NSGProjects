<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supercharger Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root {
  --bg: #F3F5F6; --panel: #FFFFFF; --panel-2: #E9EDEF;
  --fg: #141A1D; --muted: #5B666D; --line: #D8DFE3;
  --new: #0F6B78; --done: #B44F18; --plan: #6B21A8;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0D1215; --panel: #151C20; --panel-2: #1E272C;
    --fg: #E8EEF0; --muted: #93A0A7; --line: #27323A;
    --new: #45B4C2; --done: #E68A4C; --plan: #C084FC;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body);
  font-size: 14px; display: flex; flex-direction: column;
}
header {
  padding: 10px max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px));
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
}
h1 { font-family: var(--display); font-size: 1.3rem; margin: 0; text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; }
.counts { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--mono); font-size: 0.86rem; }
.counts b { font-size: 1.05rem; }
.counts .done b { color: var(--done); }
.counts .new b { color: var(--new); }
.counts .plan b { color: var(--plan); }
.spacer { flex: 1 1 auto; }
.tools { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
button, .btn {
  font: inherit; font-size: 0.85rem; background: var(--panel-2); color: var(--fg);
  border: 1px solid var(--line); border-radius: 7px; padding: 8px 11px;
  cursor: pointer; min-height: 40px;
}
button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button:focus-visible { outline: 2px solid var(--new); outline-offset: 2px; }
input[type="search"] {
  font: inherit; padding: 8px 11px; min-height: 40px; min-width: 150px;
  border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2); color: var(--fg);
}
#map { flex: 1 1 auto; min-height: 320px; background: var(--panel-2); }
.legend-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); align-items: center; }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

.leaflet-popup-content-wrapper { background: var(--panel); color: var(--fg); border-radius: 10px; }
.leaflet-popup-tip { background: var(--panel); }
.leaflet-popup-content { margin: 13px 15px; min-width: 210px; font-family: var(--body); }
.pop-name { font-weight: 600; font-size: 1rem; margin-bottom: 2px; }
.pop-meta { color: var(--muted); font-size: 0.84rem; margin-bottom: 10px; }
.pop-tag { display: inline-block; border-radius: 4px; padding: 1px 7px; font-size: 0.76rem; font-weight: 600; margin-right: 5px; }
.pop-tag.plan { background: var(--plan); color: #fff; }
.pop-tag.tp { background: var(--panel-2); color: var(--muted); }
.mark-btn { width: 100%; font-weight: 600; min-height: 44px; }
.mark-btn.is-done { background: var(--done); color: #fff; border-color: var(--done); }
.mark-btn.is-new { background: var(--new); color: #fff; border-color: var(--new); }
.pop-src { color: var(--muted); font-size: 0.76rem; margin-top: 8px; }

#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px;
  font-size: 0.88rem; z-index: 2000; opacity: 0; transition: opacity 0.18s; pointer-events: none;
}
#toast.show { opacity: 1; }
footer {
  padding: 8px max(12px, env(safe-area-inset-left, 0px));
  padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  background: var(--panel); border-top: 1px solid var(--line);
  font-size: 0.78rem; color: var(--muted);
}
@media (max-width: 620px) {
  h1 { font-size: 1.1rem; }
  .counts { font-size: 0.8rem; gap: 10px; }
}
</style>
</head>
<body>

<header>
  <h1>Supercharger Map</h1>
  <div class="counts">
    <span class="done">Visited <b id="c-done">0</b></span>
    <span class="new">Remaining <b id="c-new">0</b></span>
    <span class="plan">Planned <b id="c-plan">0</b></span>
  </div>
  <div class="spacer"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="Search name, city, state" aria-label="Search sites">
    <button id="f-new" aria-pressed="true" title="Show sites you have not charged at">Remaining</button>
    <button id="f-done" aria-pressed="true" title="Show sites you have charged at">Visited</button>
    <button id="f-plan" aria-pressed="false" title="Show only the planned trip stops">Trip only</button>
    <button id="f-route" aria-pressed="true" title="Show the planned route line">Route</button>
    <button id="export">Export</button>
    <button id="import">Import</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
  <div class="legend-row" style="flex-basis:100%">
    <span><i class="dot" style="background:var(--new)"></i>Not charged here</span>
    <span><i class="dot" style="background:var(--done)"></i>Charged here</span>
    <span><i class="dot" style="background:var(--plan);"></i>On the trip plan</span>
    <span id="src-note"></span>
  </div>
</header>

<div id="map"></div>
<div id="toast" role="status" aria-live="polite"></div>
<footer id="foot"></footer>

<script id="map-data" type="application/json">__MAP_DATA__</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('map-data').textContent);
  var STORE = 'tesla-supercharger-visits-v1';

  // Columns of the compact site rows.
  var ID = 0, NAME = 1, CITY = 2, STATE = 3, LAT = 4, LON = 5, STALLS = 6, KW = 7, TP = 8;

  // Baked-in history set, plus per-site overrides the user makes here.
  // Keeping them separate means re-importing the Tesla history never wipes a manual mark.
  var historySet = new Set(D.historyVisited);
  var overrides = {};
  try {
    var raw = localStorage.getItem(STORE);
    if (raw) overrides = JSON.parse(raw).overrides || {};
  } catch (e) { /* private window or blocked storage: run without persistence */ }

  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify({ overrides: overrides, updatedAt: new Date().toISOString() }));
    } catch (e) {
      toast('Could not save - storage is blocked in this browser');
    }
  }

  function isVisited(id) {
    if (Object.prototype.hasOwnProperty.call(overrides, id)) return !!overrides[id];
    return historySet.has(id);
  }

  var toastT;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(function () { el.classList.remove('show'); }, 1900);
  }

  var map = L.map('map', { preferCanvas: true, worldCopyJump: false })
    .setView([36.5, -92.0], 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  var routeLayer = L.polyline(D.routeLine, {
    color: '#0F6B78', weight: 3, opacity: 0.55, interactive: false
  }).addTo(map);

  var canvas = L.canvas({ padding: 0.4 });
  var markers = {};        // srcId -> circleMarker
  var filters = { showNew: true, showDone: true, tripOnly: false, route: true };
  var query = '';

  function colorFor(row) {
    if (isVisited(row[ID])) return getCss('--done');
    if (D.planned[row[ID]] != null) return getCss('--plan');
    return getCss('--new');
  }
  function getCss(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function matches(row) {
    if (filters.tripOnly && D.planned[row[ID]] == null) return false;
    var done = isVisited(row[ID]);
    if (done && !filters.showDone) return false;
    if (!done && !filters.showNew) return false;
    if (query) {
      var hay = (row[NAME] + ' ' + row[CITY] + ' ' + row[STATE]).toLowerCase();
      if (hay.indexOf(query) === -1) return false;
    }
    return true;
  }

  function popupHTML(row) {
    var id = row[ID], done = isVisited(id), day = D.planned[id];
    var bits = [];
    if (row[STALLS]) bits.push(row[STALLS] + ' stalls');
    if (row[KW]) bits.push(row[KW] + ' kW');
    bits.push(row[CITY] + ', ' + row[STATE]);
    return '<div class="pop-name">' + escapeHtml(row[NAME]) + '</div>' +
      '<div class="pop-meta">' + bits.join(' &middot; ') + '</div>' +
      (day != null ? '<span class="pop-tag plan">Trip day ' + day + '</span>' : '') +
      (row[TP] ? '<span class="pop-tag tp">third-party operator</span>' : '') +
      '<button class="mark-btn ' + (done ? 'is-done' : 'is-new') + '" data-id="' + id + '">' +
        (done ? '&#10003; Charged here &mdash; tap to undo' : 'Mark as charged here') +
      '</button>' +
      '<div class="pop-src">' +
        (historySet.has(id) ? 'In your Tesla charging history. ' : '') +
        (Object.prototype.hasOwnProperty.call(overrides, id) ? 'Changed by you here.' : '') +
      '</div>';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
    });
  }

  function toggle(id) {
    var now = isVisited(id);
    overrides[id] = !now;
    // If this puts the site back to what the history already says, drop the override.
    if (overrides[id] === historySet.has(id)) delete overrides[id];
    save();
    restyle(id);
    updateCounts();
    var m = markers[id];
    if (m && m.isPopupOpen()) m.setPopupContent(popupHTML(rowById[id]));
    toast(isVisited(id) ? 'Marked as charged' : 'Unmarked');
  }

  function restyle(id) {
    var m = markers[id];
    if (!m) return;
    var row = rowById[id];
    m.setStyle({ fillColor: colorFor(row), color: colorFor(row) });
    if (matches(row)) { if (!map.hasLayer(m)) m.addTo(map); }
    else if (map.hasLayer(m)) map.removeLayer(m);
  }

  var rowById = {};
  D.sites.forEach(function (row) {
    rowById[row[ID]] = row;
    var planned = D.planned[row[ID]] != null;
    var m = L.circleMarker([row[LAT], row[LON]], {
      renderer: canvas,
      radius: planned ? 6 : 4,
      weight: planned ? 2 : 1,
      color: colorFor(row),
      fillColor: colorFor(row),
      fillOpacity: 0.85,
    });
    m.bindPopup(function () { return popupHTML(row); }, { autoPan: true });
    markers[row[ID]] = m;
  });

  function applyFilters(fitToResults) {
    var shown = 0;
    var pts = [];
    D.sites.forEach(function (row) {
      var m = markers[row[ID]];
      if (matches(row)) {
        if (!map.hasLayer(m)) m.addTo(map);
        shown++;
        if (pts.length < 60) pts.push([row[LAT], row[LON]]);
      } else if (map.hasLayer(m)) {
        map.removeLayer(m);
      }
    });
    // A search is only useful if it takes you there.
    if (fitToResults && pts.length && pts.length <= 60) {
      map.fitBounds(L.latLngBounds(pts).pad(0.25), { maxZoom: 13 });
    }
    if (filters.route) { if (!map.hasLayer(routeLayer)) routeLayer.addTo(map); }
    else if (map.hasLayer(routeLayer)) map.removeLayer(routeLayer);
    document.getElementById('foot').textContent =
      shown + ' of ' + D.sites.length + ' sites shown. Catalog retrieved ' +
      new Date(D.catalog.retrievedAt).toLocaleDateString() +
      ' from supercharge.info (community data, not an official Tesla feed). ' +
      'Marks are saved in this browser only - use Export to move them.';
  }

  function updateCounts() {
    var done = 0, plan = 0;
    D.sites.forEach(function (row) {
      if (isVisited(row[ID])) done++;
      if (D.planned[row[ID]] != null && !isVisited(row[ID])) plan++;
    });
    document.getElementById('c-done').textContent = done;
    document.getElementById('c-new').textContent = D.sites.length - done;
    document.getElementById('c-plan').textContent = plan;
  }

  // Popup buttons are rendered fresh each open, so listen on the map container.
  document.getElementById('map').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.mark-btn') : null;
    if (!btn) return;
    toggle(Number(btn.getAttribute('data-id')));
  });

  function bindToggle(elId, key) {
    var b = document.getElementById(elId);
    b.addEventListener('click', function () {
      filters[key] = !filters[key];
      b.setAttribute('aria-pressed', String(filters[key]));
      applyFilters();
    });
  }
  bindToggle('f-new', 'showNew');
  bindToggle('f-done', 'showDone');
  bindToggle('f-plan', 'tripOnly');
  bindToggle('f-route', 'route');

  var qT;
  document.getElementById('q').addEventListener('input', function (e) {
    clearTimeout(qT);
    var v = e.target.value.toLowerCase().trim();
    qT = setTimeout(function () { query = v; applyFilters(!!v); }, 180);
  });

  document.getElementById('export').addEventListener('click', function () {
    var payload = {
      kind: 'tesla-supercharger-visits',
      version: 1,
      exportedAt: new Date().toISOString(),
      note: 'srcIds are supercharge.info site ids, not Tesla ids.',
      overrides: overrides,
      visitedSrcIds: D.sites.map(function (r) { return r[ID]; }).filter(isVisited),
    };
    var blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'supercharger-visits-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('Exported ' + payload.visitedSrcIds.length + ' visited sites');
  });

  document.getElementById('import').addEventListener('click', function () {
    document.getElementById('file').click();
  });
  document.getElementById('file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var j = JSON.parse(r.result);
        if (j.overrides && typeof j.overrides === 'object') {
          overrides = j.overrides;
        } else if (Array.isArray(j.visitedSrcIds)) {
          overrides = {};
          j.visitedSrcIds.forEach(function (id) { if (!historySet.has(id)) overrides[id] = true; });
        } else {
          toast('That file has no visit data in it');
          return;
        }
        save();
        D.sites.forEach(function (row) { restyle(row[ID]); });
        updateCounts();
        applyFilters();
        toast('Imported');
      } catch (err) {
        toast('Could not read that file');
      }
    };
    r.readAsText(f);
    e.target.value = '';
  });

  document.getElementById('src-note').textContent =
    D.historyMeta.unique2026
      ? D.historyMeta.unique2026 + ' sites from your 2026 history are pre-marked'
      : '';

  applyFilters();
  updateCounts();

  // Open on the trip corridor rather than the whole country.
  if (D.routeLine && D.routeLine.length) {
    map.fitBounds(L.polyline(D.routeLine).getBounds(), { padding: [24, 24] });
  }
})();
</script>
</body>
</html>
